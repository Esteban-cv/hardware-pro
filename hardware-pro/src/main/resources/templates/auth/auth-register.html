<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="shortcut icon" th:href="@{/img/favicon.svg}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!--SWEETALERT2 CDN-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body>
<div id="auth">
    <div class="container">
        <div class="row">
            <div class="col-md-7 col-sm-12 mx-auto">
                <div class="card pt-4">
                    <div class="card-body">
                        <div class="text-center mb-5">
                            <img th:src="@{/img/favicon.svg}" height="48" class='mb-4'>
                            <h3>Registrarse</h3>
                            <p>Por favor, completa el formulario para registrarte.</p>
                        </div>

                        <form th:action="@{/register}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                                El correo electrónico que ingresaste ya está registrado. Por favor, utiliza otro o <a th:href="@{/login}">inicia sesión</a>.
                            </div>

                            <div class="row">
                                <div class="col-md-6 col-12">
                                    <div class="form-group">
                                        <label for="first-name-column">Nombre</label>
                                        <input type="text" id="first-name-column" class="form-control" name="firstName" required>
                                    </div>
                                </div>
                                <div class="col-md-6 col-12">
                                    <div class="form-group">
                                        <label for="last-name-column">Apellido</label>
                                        <input type="text" id="last-name-column" class="form-control" name="lastName" required>
                                    </div>
                                </div>
                                <div class="col-md-6 col-12">
                                    <div class="form-group">
                                        <label for="email">Email</label>
                                        <input type="email" id="email" class="form-control" name="email" required>
                                    </div>
                                </div>
                                <div class="col-md-6 col-12">
                                    <div class="form-group">
                                        <label for="password">Contraseña</label>
                                        <input type="password" id="password" class="form-control" name="password" required>
                                    </div>
                                </div>
                            </diV>

                            <a th:href="@{/login}">¿Ya tienes una cuenta? Iniciar sesión</a>
                            <div class="clearfix">
                                <button class="btn btn-primary float-end" type="submit">Enviar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/feather.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/main.js}"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
<script th:src="@{/js/alerts.js}"></script>
</body>
</html>
