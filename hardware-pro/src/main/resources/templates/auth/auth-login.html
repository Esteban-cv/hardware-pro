<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Ferretería Pro</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="shortcut icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/app.css}">

    <!--SWEETALERT2 CDN-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body>
<div id="auth">
    <div class="container">
        <div class="row">
            <div class="col-md-5 col-sm-12 mx-auto">
                <div class="card pt-4">
                    <div class="card-body">
                        <!-- Header -->
                        <div class="text-center mb-5">
                            <img th:src="@{/img/logo-login-.png}" style="height: 100px; width: 100px" class="mb-4">
                            <h3>Inicia Sesión</h3>
                            <p>Porfavor inicia sesión para ingresar a Tuerca Dorada</p>
                        </div>

                        <!-- Form -->
                        <form th:action="@{/login}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div class="form-group position-relative has-icon-left">
                                <label for="email">Correo Electrónico</label>
                                <div class="position-relative">
                                    <input type="text" class="form-control" id="email" name="username" required>
                                    <div class="form-control-icon">
                                        <i data-feather="user"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group position-relative has-icon-left">
                                <div class="clearfix">
                                    <label for="password">Contraseña</label>
                                    <a th:href="@{/forgot-password}" class="float-end">
                                        <small>¿Olvidaste la contraseña?</small>
                                    </a>
                                </div>
                                <div class="position-relative">
                                    <input type="password" class="form-control" id="password" name="password" required>
                                    <div class="form-control-icon">
                                        <i data-feather="lock"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="form-check clearfix my-4">
                                <div class="checkbox float-start">
                                    <input type="checkbox" id="checkbox1" class="form-check-input" name="remember-me">
                                    <label for="checkbox1">Recordarme</label>
                                </div>
                                <div class="float-end">
                                    <a th:href="@{/register}">¿No tienes una cuenta?</a>
                                </div>
                            </div>
                            <div class="clearfix">
                                <button class="btn btn-primary float-end" type="submit">Enviar</button>
                            </div>
                        </form>

                    </div> <!-- card-body -->
                </div> <!-- card -->
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script th:src="@{/js/feather.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/alerts.js}"></script>


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
<script th:src="@{/js/alerts.js}"></script>

</body>
</html>
