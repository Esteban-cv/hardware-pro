<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sidebar</title>
</head>

<body>
    <div id="sidebar" class='active' th:fragment="sidebar"><!--sidebar-->
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <img th:src="@{/img/logo.svg}" alt="" srcset="">
            </div>
            <div class="sidebar-menu">
                <ul class="menu">


                    <li class='sidebar-title'>Menu Principal</li>



                    <li class="sidebar-item">

                        <a th:href="@{/dashboard}" class='sidebar-link'>
                            <i data-feather="home" width="20"></i>
                            <span>Estadísticas</span>
                        </a>


                    </li>



                    <li class="sidebar-item  has-sub">

                        <a href="#" class='sidebar-link'>
                            <i data-feather="shopping-cart" width="20"></i>
                            <span>Ventas</span>
                        </a>


                        <ul class="submenu ">

                            <li>
                                <a th:href="@{/sales}">Consultar</a>
                            </li>

                            <li>
                                <a th:href="@{/sales/form}">Nueva Venta</a>
                            </li>
                        </ul>
                    </li>

                    <li class="sidebar-item  has-sub">

                        <a href="#" class='sidebar-link'>
                            <i data-feather="clipboard" width="20"></i>
                            <span>Compras</span>
                        </a>


                        <ul class="submenu ">

                            <li>
                                <a th:href="@{/purchases}">Consultar</a>
                            </li>

                            <li>
                                <a th:href="@{/purchases/form}">Nueva Compra</a>
                            </li>
                        </ul>
                    </li>

                    <li class="sidebar-item  has-sub">

                        <a href="#" class='sidebar-link'>
                            <i data-feather="box" width="20"></i>
                            <span>Artículos</span>
                        </a>


                        <ul class="submenu ">

                            <li>
                                <a th:href="@{/articles}">Consultar</a>
                            </li>

                            <li>
                                <a th:href="@{/articles/form}">Nuevo Artículo</a>
                            </li>
                        </ul>
                    </li>

                    <li class="sidebar-item  has-sub">

                        <a href="#" class='sidebar-link'>
                            <i data-feather="tag" width="20"></i>
                            <span>Categorías</span>
                        </a>


                        <ul class="submenu ">

                            <li>
                                <a th:href="@{/categories}">Consultar</a>
                            </li>

                            <li>
                                <a th:href="@{/categories/form}">Nueva Categoría</a>
                            </li>
                        </ul>
                    </li>

                    <li class="sidebar-item  has-sub">

                        <a href="#" class='sidebar-link'>
                            <i data-feather="location" width="20"></i>
                            <span>Ubicaciones</span>
                        </a>


                        <ul class="submenu ">

                            <li>
                                <a th:href="@{/categories}">Consultar</a>
                            </li>

                            <li>
                                <a th:href="@{/categories/form}">Nueva Ubicación</a>
                            </li>
                        </ul>
                    </li>

                </ul>
            </div>
            <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
        </div>
    </div>
</body>

</html>
