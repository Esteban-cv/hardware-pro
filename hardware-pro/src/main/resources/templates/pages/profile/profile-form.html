<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
<div layout:fragment="content">

    <div class="page-title">
        <h3><i class="fas fa-user-edit me-2"></i>Mi Perfil</h3>
        <p class="text-subtitle text-muted">Actualiza tu información personal.</p>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-body">
                <form th:action="@{/profile/save}" th:object="${user}" method="post">

                    <h4 class="card-title mb-4">Información de la Cuenta</h4>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="email" class="form-label">Correo Electrónico (Usuario)</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" readonly disabled>
                            <small class="form-text text-muted">El correo electrónico no se puede modificar.</small>
                        </div>

                        <div class="col-12"></div>

                        <div class="col-md-6">
                            <label for="firstName" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
                        </div>

                        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/dashboard}" class="btn btn-secondary">Cancelar</a>
                            <a th:href="@{/profile/change-password}" class="btn btn-info">
                                <i class="fas fa-key me-1"></i> Cambiar Contraseña
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>

</div>
</body>
</html>
