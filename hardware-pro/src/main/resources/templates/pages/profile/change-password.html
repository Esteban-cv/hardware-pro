<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <div class="page-title">
        <h3><i class="fas fa-key me-2"></i>Cambiar Contraseña</h3>
        <p class="text-subtitle text-muted">Para tu seguridad, ingresa tu contraseña actual.</p>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-body">
                <form th:action="@{/profile/change-password}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="currentPassword" class="form-label">Contraseña Actual</label>
                            <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
                        </div>
                        <div class="col-12"></div> <div class="col-md-6">
                        <label for="newPassword" class="form-label">Nueva Contraseña</label>
                        <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                    </div>
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label">Confirmar Nueva Contraseña</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/profile}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Actualizar Contraseña
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>
</body>
</html>
