<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
<div layout:fragment="content">

    <div class="page-title d-flex justify-content-between align-items-center">
        <div>
            <h3 th:if="${article.idArticle == null}"><i class="fas fa-plus-circle me-2"></i>Crear Nuevo Artículo</h3>
            <h3 th:unless="${article.idArticle == null}"><i class="fas fa-edit me-2"></i>Editar Artículo</h3>
            <p class="text-subtitle text-muted">Complete la información del artículo.</p>
        </div>
        <a th:href="@{/articles}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i>
            Volver al listado
        </a>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-body">
                <form th:action="@{/articles/save}" th:object="${article}" method="post">
                    <input type="hidden" th:field="*{idArticle}" />

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Nombre del Artículo</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="code" class="form-label">Código</label>
                            <input type="text" class="form-control" id="code" th:field="*{code}">
                        </div>

                        <div class="col-md-6">
                            <label for="price" class="form-label">Precio Unitario</label>
                            <div class="input-group">
                                <span class="input-group-text" th:text="${currencySymbol}"></span>
                                <input type="number" class="form-control" id="price" th:field="*{price}" required step="0.01" min="0">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="quantity" class="form-label">Cantidad en Stock</label>
                            <input type="number" class="form-control" id="quantity" th:field="*{quantity}" required min="0">
                        </div>

                        <div class="col-md-4">
                            <label for="category" class="form-label">Categoría</label>
                            <select id="category" class="form-select" th:field="*{category}" required>
                                <option value="">Seleccione...</option>
                                <option th:each="cat : ${categories}" th:value="${cat.idCategory}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="unit" class="form-label">Unidad de Medida</label>
                            <select id="unit" class="form-select" th:field="*{unit}" required>
                                <option value="">Seleccione...</option>
                                <option th:each="u : ${units}" th:value="${u.idUnit}" th:text="${u.name}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="supplier" class="form-label">Proveedor</label>
                            <select id="supplier" class="form-select" th:field="*{supplier}">
                                <option value="">Seleccione...</option>
                                <option th:each="sup : ${suppliers}" th:value="${sup.idSupplier}" th:text="${sup.name}"></option>
                            </select>
                        </div>

                        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/articles}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                <span th:if="${article.idArticle == null}"><i class="fas fa-save me-1"></i> Crear Artículo</span>
                                <span th:unless="${article.idArticle == null}"><i class="fas fa-save me-1"></i> Guardar Cambios</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>

</div>
</body>
</html>
