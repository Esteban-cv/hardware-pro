<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
<div layout:fragment="content">
    <div class="page-title">
        <h3>Gestión de Clientes</h3>
        <p class="text-subtitle text-muted">Gestiona fácilmente los clientes registrados: consulta, edita o elimina según sea necesario.</p>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-header">
                <div class="d-flex flex-wrap gap-2">
                    <a th:href="@{/clients/form}" class="btn btn-primary">
                        <i data-feather="plus-circle"></i> Nuevo Cliente
                    </a>
                    <a th:href="@{/clients/salereport}" class="btn btn-danger">
                        <i class="fas fa-file-pdf me-1"></i> PDF
                    </a>
                    <a th:href="@{/clients/salereport/excel}" class="btn btn-success">
                        <i class="fas fa-file-excel me-1"></i> EXCEL
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="myTable">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOMBRE</th>
                            <th>DOCUMENTO</th>
                            <th>CELULAR</th>
                            <th>ACCIONES</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="client : ${clients}">
                            <td th:text="${client.idClient}"></td>
                            <td th:text="${client.name}"></td>
                            <td th:text="${client.document ?: 'N/A'}"></td>
                            <td th:text="${client.phone ?: 'N/A'}"></td>
                            <td>
                                <div class="d-flex gap-1 justify-content-center">
                                    <button class="btn btn-info btn-sm btn-view" th:data-id="${client.idClient}" data-type="client" title="Ver Detalles">
                                        <i data-feather="eye"></i>
                                    </button>
                                    <a th:href="@{'/clients/edit/' + ${client.idClient}}" class="btn btn-warning btn-sm" title="Editar">
                                        <i data-feather="edit"></i>
                                    </a>
                                    <form th:action="@{'/clients/delete/' + ${client.idClient}}" method="post" class="form-delete">
                                        <button type="submit" class="btn btn-danger btn-sm" title="Eliminar">
                                            <i data-feather="trash-2"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <div class="modal fade" id="clientDetailsModal" tabindex="-1" aria-labelledby="clientDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title" id="clientDetailsModalLabel">
                        <i class="fas fa-box me-2"></i>Detalles del Cliente
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h4 class="mb-1" id="modalClientName"></h4>
                    <p class="text-muted mb-3">
                        ID: <span id="modalClientId" class="fw-bold"></span> |
                    </p>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Documento:</span>
                            <strong id="modalClientDocument"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Coreo electrónico:</span>
                            <strong id="modalClientEmail"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Dirección:</span>
                            <strong id="modalClientAddress"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Teléfono:</span>
                            <strong id="modalClientPhone"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>RUT:</span>
                            <strong id="modalClientRut"></strong>
                        </li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
