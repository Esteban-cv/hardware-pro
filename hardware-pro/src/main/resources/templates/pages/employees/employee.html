<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
<div layout:fragment="content">
    <div class="page-title">
        <h3>Gestión de Empleados</h3>
        <p class="text-subtitle text-muted">Gestiona el personal y sus cuentas de usuario.</p>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-header">
                <div class="d-flex flex-wrap gap-2">
                    <a th:href="@{/employees/form}" class="btn btn-primary">
                        <i data-feather="plus-circle"></i> Nuevo Empleado
                    </a>
                    <a th:href="@{/employees/salereport}" class="btn btn-danger">
                        <i class="fas fa-file-pdf me-1"></i> PDF
                    </a>
                    <a th:href="@{/employees/salereport/excel}" class="btn btn-success">
                        <i class="fas fa-file-excel me-1"></i> EXCEL
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover table-employees" id="myTable">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOMBRE</th>
                            <th>DOCUMENTO</th>
                            <th>EMAIL (USUARIO)</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="employee : ${employees}">
                            <td class="text-center" th:text="${employee.idEmployee}"></td>
                            <td th:text="${employee.firstName + ' ' + employee.lastName}"></td>
                            <td th:text="${employee.document}"></td>
                            <td th:text="${employee.user?.email}"></td>
                            <td class="text-center">
                                <span th:if="${employee.active}" class="badge bg-success">Activo</span>
                                <span th:unless="${employee.active}" class="badge bg-danger">Inactivo</span>
                            </td>
                            <td>
                                <div class="d-flex gap-1 justify-content-center">
                                    <button class="btn btn-info btn-sm btn-view" th:data-id="${employee.idEmployee}" data-type="employee" title="Ver Detalles">
                                        <i data-feather="eye"></i>
                                    </button>
                                    <a th:href="@{'/employees/edit/' + ${employee.idEmployee}}" class="btn btn-warning btn-sm" title="Editar">
                                        <i data-feather="edit"></i>
                                    </a>
                                    <form th:action="@{'/employees/toggle-active/' + ${employee.idEmployee}}" method="post" class="form-employee-inactivate">
                                        <button type="submit" class="btn btn-sm"
                                                th:classappend="${employee.active ? 'btn-danger' : 'btn-success'}"
                                                th:title="${employee.active ? 'Inactivar Empleado' : 'Reactivar Empleado'}">
                                            <i data-feather="x-circle" th:if="${employee.active}"></i>
                                            <i data-feather="check-circle" th:unless="${employee.active}"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
    <div class="modal fade" id="employeeDetailsModal" tabindex="-1" aria-labelledby="employeeDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info">
                    <h5 class="modal-title" id="employeeDetailsModalLabel">
                        <i class="fas fa-user-tie me-2"></i>Detalles del Empleado
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h4 class="mb-1" id="modalEmployeeName"></h4>
                    <p class="text-muted mb-3">
                        ID: <span id="modalEmployeeId" class="fw-bold"></span>
                    </p>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Documento:</span>
                            <strong id="modalEmployeeDocument"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Email (Usuario):</span>
                            <strong id="modalEmployeeEmail"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Teléfono:</span>
                            <strong id="modalEmployeePhone"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Dirección:</span>
                            <strong id="modalEmployeeAddress"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Rol:</span>
                            <strong id="modalEmployeeRole"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Estado:</span>
                            <strong id="modalEmployeeStatus"></strong>
                        </li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
