<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
<div layout:fragment="content">

    <div class="page-title d-flex justify-content-between align-items-center">
        <div>
            <h3 th:if="${employee.idEmployee == null}"><i class="fas fa-user-plus me-2"></i>Crear Nuevo Empleado</h3>
            <h3 th:unless="${employee.idEmployee == null}"><i class="fas fa-edit me-2"></i>Editar Empleado</h3>
            <p class="text-subtitle text-muted">Complete la información personal y los datos de acceso.</p>
        </div>
        <a th:href="@{/employees}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i>
            Volver al listado
        </a>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-body">
                <form th:action="@{/employees/save}" th:object="${employee}" method="post">
                    <input type="hidden" th:field="*{idEmployee}" />

                    <h4 class="card-title border-bottom pb-2 mb-3">Información Personal</h4>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">Nombres</label>
                            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="document" class="form-label">Documento</label>
                            <input type="text" class="form-control" id="document" th:field="*{document}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="phone" th:field="*{phone}">
                        </div>
                        <div class="col-12">
                            <label for="address" class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="address" th:field="*{address}">
                        </div>
                    </div>

                    <h4 class="card-title border-bottom pb-2 mb-3">Cuenta de Acceso</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="userEmail" class="form-label">Email (Usuario)</label>
                            <input type="email" class="form-control" id="userEmail" th:field="*{user.email}" required>
                        </div>
                        <div class="col-md-6" th:if="${employee.idEmployee == null}">
                            <label for="userPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="userPassword" th:field="*{user.password}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="userRole" class="form-label">Rol del Usuario</label>
                            <select id="userRole" class="form-select" th:field="*{user.role}" required>
                                <option value="">Seleccione un rol...</option>
                                <option th:each="r : ${roles}" th:value="${r.idRole}" th:text="${r.name}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/employees}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <span th:if="${employee.idEmployee == null}"><i class="fas fa-save me-1"></i> Crear Empleado</span>
                            <span th:unless="${employee.idEmployee == null}"><i class="fas fa-save me-1"></i> Guardar Cambios</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>
</body>
</html>
