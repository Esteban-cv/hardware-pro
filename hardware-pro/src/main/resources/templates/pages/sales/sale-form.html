<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <div class="page-title d-flex justify-content-between align-items-center">
        <div><h3><i class="fas fa-cash-register me-2"></i>Registrar Nueva Venta</h3><p class="text-subtitle text-muted">Añade artículos del catálogo para crear una nueva venta.</p></div>
        <a th:href="@{/sales}" class="btn btn-secondary"><i class="fas fa-arrow-left me-1"></i> Volver al listado</a>
    </div>
    <section class="section">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card h-100">
                    <div class="card-header"><h4 class="card-title"><i class="fas fa-search me-2"></i>Catálogo de Artículos</h4></div>
                    <div class="card-body d-flex flex-column">
                        <div class="input-group mb-3"><span class="input-group-text"><i class="fas fa-search"></i></span><input type="text" id="articleSearch" class="form-control" placeholder="Buscar artículo..."></div>
                        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" id="articlesGrid" style="max-height: 65vh; overflow-y: auto;">
                            <div th:each="article : ${articles}" class="col">
                                <div class="card h-100 shadow-sm" th:attr="data-id=${article.idArticle}, data-name=${article.name}, data-code=${article.code}, data-price=${article.price}, data-stock=${article.quantity}">
                                    <div class="card-body d-flex flex-column">
                                        <h5 class="card-title fs-6" th:text="${article.name}"></h5>
                                        <p class="card-subtitle mb-2 text-muted small" th:text="'Código: ' + ${article.code}"></p>
                                        <div class="mt-auto">
                                            <div class="d-flex justify-content-between align-items-center mb-2">
                                                <span class="fw-bold text-primary" th:text="'$' + ${#numbers.formatDecimal(article.price, 1, 'COMMA', 2, 'POINT')}"></span>
                                                <span class="badge" th:classappend="${article.quantity > 10 ? 'bg-success' : article.quantity > 0 ? 'bg-warning' : 'bg-danger'}" th:text="'Stock: ' + ${article.quantity}"></span>
                                            </div>
                                            <button type="button" class="btn btn-primary btn-sm w-100" onclick="addToSaleCart(this)" th:disabled="${article.quantity == 0}"><i class="fas fa-plus me-1"></i> Añadir a la Venta</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <form id="saleForm" th:action="@{/sales/save}" th:object="${sale}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <h4 class="card-title border-bottom pb-2 mb-3"><i class="fas fa-file-invoice-dollar me-2"></i>Datos de la Venta</h4>
                            <div class="row g-3 mb-4">
                                <div class="col-12"><label for="client" class="form-label">Cliente *</label><select id="client" class="form-select" th:field="*{client}" required><option value="">Seleccione...</option><option th:each="c : ${clients}" th:value="${c.idClient}" th:text="${c.name}"></option></select></div>
                                <div class="col-12"><label for="employee" class="form-label">Vendido por *</label><select id="employee" class="form-select" th:field="*{employee}" required><option value="">Seleccione...</option><option th:each="emp : ${employees}" th:value="${emp.idEmployee}" th:text="${emp.firstName + ' ' + emp.lastName}"></option></select></div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3"><h4 class="card-title mb-0"><i class="fas fa-shopping-cart me-2"></i>Artículos a Vender</h4><span id="saleCartCount" class="badge bg-primary rounded-pill">0</span></div>
                            <div class="border rounded p-3 bg-light" id="saleCartContainer" style="min-height: 150px; flex-grow: 1; overflow-y: auto;"><div class="text-center text-muted" id="emptySaleCart"><p class="mb-1"><i class="fas fa-plus-circle fa-2x"></i></p><small>Añada artículos desde el catálogo</small></div><div id="saleCartItems"></div></div>
                            <ul class="list-group list-group-flush my-3">
                                <li class="list-group-item d-flex justify-content-between"><span>Subtotal:</span> <span id="saleSubtotal">0.00</span></li>
                                <li class="list-group-item d-flex justify-content-between"><span>IVA (<span th:text="${#numbers.formatDecimal(vatRate, 1, 'COMMA', 0, 'POINT')}">19</span>%):</span> <span id="saleTax">0.00</span></li>
                                <li class="list-group-item d-flex justify-content-between fs-5 fw-bold"><span class="text-success">Total Venta:</span> <span id="saleTotal" class="text-success">0.00</span></li>
                            </ul>
                            <div class="d-grid gap-2 mt-auto"><button type="submit" class="btn btn-success btn-lg" id="processSaleButton" disabled>
                                <i class="fas fa-check-circle me-1"></i> Registrar Venta</button>
                            </div>
                            <div id="saleItemsHidden"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
