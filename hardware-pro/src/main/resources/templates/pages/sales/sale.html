<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Voler Admin Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">

    <link rel="stylesheet" th:href="@{/css/Chart.min.css}">

    <link rel="stylesheet" th:href="@{/css/perfect-scrollbar.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="shortcut icon" th:href="@{/img/favicon.svg}" type="image/x-icon">
</head>

<body>
<div id="app">
    <nav th:replace="fragments/sidebar :: sidebar"></nav>
    <div id="main">
        <div th:replace="fragments/header :: header"></div>
        <div layout:fragment="content" class="main-content container-fluid">

            <!-- 1. Título de la Página (Adaptado) -->
            <div class="page-title">
                <h3>Gestión de Ventas</h3>
                <p class="text-subtitle text-muted">Gestiona fácilmente las ventas registradas: consulta, edita o elimina según sea necesario.</p>
            </div>

            <!-- 2. Sección Principal de Contenido -->
            <section class="section">
                <div class="card">
                    <div class="card-header">
                        <!-- 3. Botones de Acción (Estilizados con Bootstrap) -->
                        <div class="d-flex flex-wrap gap-2">
                            <a th:href="@{/sales/form}" class="btn btn-primary">
                                <i class="fas fa-plus-circle me-1"></i> Nueva Venta
                            </a>
                            <a th:href="@{/sales/salereport}" class="btn btn-danger">
                                <i class="fas fa-file-pdf me-1"></i> PDF
                            </a>
                            <a th:href="@{/sales/salereport/excel}" class="btn btn-success">
                                <i class="fas fa-file-excel me-1"></i> EXCEL
                            </a>
                        </div>
                    </div>
                    <div class="card-body">

                        <!-- Mensaje de éxito (opcional) -->
                        <div th:if="${success}" th:text="${success}" class="alert alert-success" id="alert-success"></div>

                        <!-- 4. Tabla de Ventas (Dentro de un div responsive y estilizada) -->
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="myTable">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>FECHA</th>
                                    <th>SUBTOTAL</th>
                                    <th>IVA</th>
                                    <th>TOTAL</th>
                                    <th>CLIENTE</th>
                                    <th>EMPLEADO</th>
                                    <th>ACCIONES</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="sale : ${sales}">
                                    <td th:text="${sale.idSale}"></td>
                                    <td th:text="${sale.date}"></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(sale.subTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(sale.tax, 1, 'COMMA', 2, 'POINT')}"></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(sale.total, 1, 'COMMA', 2, 'POINT')}"></td>
                                    <td th:text="${sale.client.name}"></td>
                                    <td th:text="${sale.employee.name}"></td>
                                    <td>
                                        <!-- 5. Botones de Acción en la tabla (Estilizados con Bootstrap) -->
                                        <div class="d-flex gap-1">
                                            <button class="btn btn-info btn-sm" th:data-id="${sale.idSale}" data-type="sale" title="Ver Detalles">
                                                <i data-feather="eye"></i>
                                            </button>
                                            <a th:href="@{'/sales/edit/' + ${sale.idSale}}" class="btn btn-warning btn-sm" title="Editar">
                                                <i data-feather="edit"></i>
                                            </a>
                                            <form th:action="@{'/sales/delete/' + ${sale.idSale}}" method="post">
                                                <button type="submit" class="btn btn-danger btn-sm" title="Eliminar">
                                                    <i data-feather="trash-2"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <footer th:replace="fragments/footer :: footer"></footer>
    </div>
</div>
<script th:src="@{/js/feather.min.js}"></script>
<script th:src="@{/js/perfect-scrollbar.min.js}"></script>
<script th:src="@{/js/app.js}"></script>

<script th:src="@{/js/Chart.min.js}"></script>
<script th:src="@{/js/apexcharts.min.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
<script th:src="@{/js/detail-modal.js}"></script>

<script th:src="@{/js/main.js}"></script>

</body>

</html>
