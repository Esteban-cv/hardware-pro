<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
<div layout:fragment="content">

    <div class="page-title d-flex justify-content-between align-items-center">
        <div>
            <h3><i class="fas fa-truck-loading me-2"></i>Registrar Nueva Compra</h3>
            <p class="text-subtitle text-muted">Añade artículos del catálogo para crear una orden de compra.</p>
        </div>
        <a th:href="@{/purchases}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i>
            Volver al listado
        </a>
    </div>

    <div id="notificationContainer" class="my-3"></div>

    <section class="section">
        <div class="row g-4">

            <div class="col-lg-7">
                <div class="card h-100">
                    <div class="card-header"><h4 class="card-title"><i class="fas fa-search me-2"></i>Catálogo de Artículos</h4></div>
                    <div class="card-body d-flex flex-column">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-search"></i></span>
                            <input type="text" id="articleSearch" class="form-control" placeholder="Buscar artículo por nombre o código...">
                        </div>

                        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" id="articlesGrid" style="max-height: 65vh; overflow-y: auto;">
                            <div th:each="article : ${allArticles}" class="col">
                                <div class="card h-100 shadow-sm" th:attr="data-id=${article.idArticle}, data-name=${article.name}, data-code=${article.code}, data-price=${article.price}, data-stock=${article.quantity}">
                                    <div class="card-body d-flex flex-column">
                                        <h5 class="card-title fs-6" th:text="${article.name}"></h5>
                                        <p class="card-subtitle mb-2 text-muted small" th:text="'Código: ' + ${article.code}"></p>
                                        <div class="mt-auto">
                                            <div class="d-flex justify-content-between align-items-center mb-2">
                                                <span class="fw-bold text-primary" th:text="'$' + ${#numbers.formatDecimal(article.price, 1, 'COMMA', 2, 'POINT')}"></span>
                                                <span class="badge bg-secondary" th:text="'Stock: ' + ${article.quantity}"></span>
                                            </div>
                                            <button type="button" class="btn btn-primary btn-sm w-100" onclick="addToPurchaseOrder(this)">
                                                <i class="fas fa-plus me-1"></i> Añadir a la Compra
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <form id="purchaseForm" th:action="@{/purchases/save}" th:object="${purchase}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <h4 class="card-title border-bottom pb-2 mb-3"><i class="fas fa-file-invoice me-2"></i>Datos de la Compra</h4>
                            <div class="row g-3 mb-4">
                                <div class="col-12">
                                    <label for="supplier" class="form-label">Proveedor *</label>
                                    <select id="supplier" class="form-select" th:field="*{supplier}" required>
                                        <option value="">Seleccione...</option>
                                        <option th:each="sup : ${allSuppliers}" th:value="${sup.idSupplier}" th:text="${sup.name}"></option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label for="employee" class="form-label">Registrado por *</label>
                                    <select id="employee" class="form-select" th:field="*{employee}" required>
                                        <option value="">Seleccione...</option>
                                        <option th:each="emp : ${allEmployees}" th:value="${emp.idEmployee}" th:text="${emp.name}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                                <h4 class="card-title mb-0"><i class="fas fa-shopping-basket me-2"></i>Artículos a Comprar</h4>
                                <span id="purchaseCartCount" class="badge bg-primary rounded-pill">0</span>
                            </div>
                            <div class="border rounded p-3 bg-light" id="purchaseCartContainer" style="min-height: 150px; flex-grow: 1; overflow-y: auto;">
                                <div class="text-center text-muted" id="emptyPurchaseCart">
                                    <p class="mb-1"><i class="fas fa-plus-circle fa-2x"></i></p>
                                    <small>Añada artículos desde el catálogo</small>
                                </div>
                                <div id="purchaseCartItems"></div>
                            </div>

                            <ul class="list-group list-group-flush my-3">
                                <li class="list-group-item d-flex justify-content-between"><span>Subtotal:</span> <span id="purchaseSubtotal">$0.00</span></li>
                                <li class="list-group-item d-flex justify-content-between"><span>IVA (19%):</span> <span id="purchaseTax">$0.00</span></li>
                                <li class="list-group-item d-flex justify-content-between fs-5 fw-bold"><span class="text-success">Total Compra:</span> <span id="purchaseTotal" class="text-success">$0.00</span></li>
                            </ul>

                            <div class="d-grid gap-2 mt-auto">
                                <button type="submit" class="btn btn-success btn-lg" id="processPurchaseButton" disabled>
                                    <i class="fas fa-check-circle me-1"></i> Registrar Compra
                                </button>
                            </div>

                            <div id="purchaseItemsHidden"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
