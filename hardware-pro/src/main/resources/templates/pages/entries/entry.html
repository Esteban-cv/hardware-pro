<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<body>
<div layout:fragment="content">
    <div class="page-title">
        <h3>Gestión de Entradas</h3>
        <p class="text-subtitle text-muted">Gestiona fácilmente lass entradas registradas: consulta, edita o elimina según sea necesario.</p>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-header">
                <div class="d-flex flex-wrap gap-2">
                    <a th:href="@{/entries/form}" class="btn btn-primary">
                        <i class="fas fa-plus-circle me-1"></i> Nueva Entrada
                    </a>
                    <a th:href="@{/entries/salereport}" class="btn btn-danger">
                        <i class="fas fa-file-pdf me-1"></i> PDF
                    </a>
                    <a th:href="@{/entries/salereport/excel}" class="btn btn-success">
                        <i class="fas fa-file-excel me-1"></i> EXCEL
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="myTable">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>FECHA</th>
                            <th>CANTIDAD</th>
                            <th>NOMBRE ARTICULO</th>
                            <th>ACCIONES</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="entry : ${entries}">
                            <td th:text="${entry.idEntry}"></td>
                            <td th:text="${#temporals.format(entry.dateEntry, 'dd/MM/yyyy')}"></td>
                            <td th:text="${entry.quantity}"></td>
                            <td th:text="${entry.article.name != null ? entry.article.name : 'N/A'}"></td>
                            <td>
                                <div class="d-flex gap-1 justify-content-center">
                                    <button class="btn btn-info btn-sm btn-view" th:data-id="${entry.idEntry}" data-type="entry" title="Ver Detalles">
                                        <i data-feather="eye"></i>
                                    </button>
                                    <a th:href="@{'/entries/edit/' + ${entry.idEntry}}" class="btn btn-warning btn-sm" title="Editar">
                                        <i data-feather="edit"></i>
                                    </a>
                                    <form th:action="@{'/entries/delete/' + ${entry.idEntry}}" method="post" class="form-delete">
                                        <button type="submit" class="btn btn-danger btn-sm" title="Eliminar">
                                            <i data-feather="trash-2"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <div class="modal fade" id="entryDetailsModal" tabindex="-1" aria-labelledby="entryDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title" id="entryDetailsModalLabel">
                        Detalles de la Entrada - ID: <span id="modalEntryId"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Fecha de Entrada:</span>
                            <strong id="modalEntryDate"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Artículo:</span>
                            <strong id="modalEntryArticle"></strong>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span>Cantidad Ingresada:</span>
                            <strong id="modalEntryQuantity" class="badge bg-secondary fs-6"></strong>
                        </li>
                    </ul>

                    <div class="mt-3" id="observationsContainer">
                        <h6 class="border-top pt-3">Observaciones</h6>
                        <p id="modalEntryObservations" class="text-muted fst-italic mb-0"></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
