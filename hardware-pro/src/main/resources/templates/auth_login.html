<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Voler Admin Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="shortcut icon" th:href="@{/img/favicon.svg}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
<div id="auth">
    <div class="container">
        <div class="row">
            <div class="col-md-5 col-sm-12 mx-auto">
                <div class="card pt-4">
                    <div class="card-body">

                        <!-- Header -->
                        <div class="text-center mb-5">
                            <img th:src="@{/img/favicon.svg}" height="48" class="mb-4">
                            <h3>Sign In</h3>
                            <p>Please sign in to continue to Voler.</p>
                        </div>

                        <!-- Form -->
                        <div>
                            <div class="form-group position-relative has-icon-left">
                                <label for="email">Correo Electrónico</label>
                                <div class="position-relative">
                                    <input type="text" class="form-control" id="email" name="email">
                                    <div class="form-control-icon">
                                        <i data-feather="user"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group position-relative has-icon-left">
                                <div class="clearfix">
                                    <label for="password">Password</label>
                                    <a th:href="@{/auth/forgot-password}" class="float-end">
                                        <small>Forgot password?</small>
                                    </a>
                                </div>
                                <div class="position-relative">
                                    <input type="password" class="form-control" id="password" name="password">
                                    <div class="form-control-icon">
                                        <i data-feather="lock"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="form-check clearfix my-4">
                                <div class="checkbox float-start">
                                    <input type="checkbox" id="checkbox1" class="form-check-input">
                                    <label for="checkbox1">Remember me</label>
                                </div>
                                <div class="float-end">
                                    <a th:href="@{/auth/register}">Don't have an account?</a>
                                </div>
                            </div>
                            <div class="clearfix">
                                <button class="btn btn-primary float-end" type="button" id="submitBtn">Submit</button>
                            </div>
                        </div>


                        <!-- Divider -->
                        <div class="divider">
                            <div class="divider-text">OR</div>
                        </div>

                        <!-- Social buttons -->
                        <div class="row">
                            <div class="col-sm-6">
                                <button class="btn btn-block mb-2 btn-primary">
                                    <i data-feather="facebook"></i> Facebook
                                </button>
                            </div>
                            <div class="col-sm-6">
                                <button class="btn btn-block mb-2 btn-secondary">
                                    <i data-feather="github"></i> Github
                                </button>
                            </div>
                        </div>

                    </div> <!-- card-body -->
                </div> <!-- card -->
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script th:src="@{/js/feather.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/login.js}"></script>

</body>
</html>
